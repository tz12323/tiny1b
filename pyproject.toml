[build-system]
requires = ["cython>=3.2.3", "numpy>=1.24.4", "setuptools>=75.3.2", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tiny1b"
version = "1.0"
description = "High-performance UVC camera bindings"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "TaoZhe", email = "2760686250@qq.com" }]
requires-python = ">=3.8"

dependencies = ["numpy"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
